name: TCGPlayer Price Scrapper

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions
  schedule:
    - cron: '0 18 * * *' # Opcional: Ejecutar todos los días a las 18:00 UTC

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    # 1. Create credentials.json BEFORE restoring and building
    - name: Create credentials.json in root directory
      shell: pwsh
      run: |
        $env:GOOGLE_CREDENTIALS_JSON | Out-File -Encoding utf8 "credentials.json"
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --no-restore

    - name: Install Playwright CLI
      run: dotnet tool install --global Microsoft.Playwright.CLI

    - name: Install Playwright Browsers (Chromium)
      run: playwright install chromium
        
    - name: Run Tests & Push to Google Sheets
      run: dotnet test --no-build --verbosity normal
      
    - name: Upload Execution Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: execution-log
        path: |
          Logs/execution.log
          **/Logs/execution.log
